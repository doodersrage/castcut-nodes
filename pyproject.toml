# Comfy Registry metadata (https://docs.comfy.org/registry/specifications). The pack is published
# from a standalone copy of this folder: scripts/castcut-nodes-release.sh. Keep `version` equal to
# CASTCUT_VERSION in castcut_nodes.py (tests/test_castcut.py checks it).
[project]
name = "castcut-nodes"
description = "Castcut's checks inside ComfyUI: in-job pose score and best-of-two pick, matte repair, and HTTP routes that answer face, pose and two-person pose checks on the CPU without waiting for the render queue, plus input-folder clean-up and health for the Castcut app."
version = "1.5.0"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.9"
# ComfyUI already ships both; listed so a standalone install says what it imports.
dependencies = ["numpy", "pillow"]
classifiers = ["Operating System :: OS Independent"]

[project.urls]
Repository = "https://github.com/doodersrage/castcut-nodes"
Documentation = "https://github.com/doodersrage/castcut/blob/main/docs/castcut-nodes.md"
"Bug Tracker" = "https://github.com/doodersrage/castcut-nodes/issues"

[tool.comfy]
# Placeholder: the Comfy Registry publisher id you create at https://registry.comfy.org.
PublisherId = "doodersrage"
DisplayName = "Castcut nodes"
Icon = ""
includes = []
